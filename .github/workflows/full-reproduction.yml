# Full reproduction of every study on a native x86-64 Linux runner, compared with the saved results,
# and every number of the paper recomputed from the new run. Start it by hand, or by adding the
# full-reproduction label to a pull request.
name: full reproduction

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-reproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Pinned environment
        run: make setup PYTHON=python
      - name: Full reproduction
        run: make reproduce WORKERS=4
      - name: Keep the comparison, environment and run records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: full-reproduction-${{ github.sha }}
          path: |
            build/reproduce/comparison.json
            build/reproduce/environment.json
            build/reproduce/*/run.json
            build/reproduce/*/solver_diagnostics.json
          retention-days: 30
          if-no-files-found: warn
