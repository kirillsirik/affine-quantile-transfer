# Quick checks for every pull request and for main: unit tests, the saved results, every number of
# the paper against them, and smoke runs of every study. The full reproduction is separate: make
# reproduce, or the full-reproduction workflow.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Pinned environment
        run: make setup PYTHON=python
      - name: Unit tests, saved results and the numbers of the paper
        run: make check
      - name: Smoke runs
        run: make smoke
      - name: Keep the smoke comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checks-${{ github.sha }}
          path: |
            build/smoke/comparison.json
            build/smoke/environment.json
          retention-days: 30
          if-no-files-found: error
